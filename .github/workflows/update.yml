name: Aggiorna Hattrick Terminal

on:
  schedule:
    - cron: '0 */3 * * *' # Esegue lo script ogni 3 ore
  workflow_dispatch:      # Permette anche l'avvio manuale dal sito di GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permette all'action di scrivere e aggiornare il file nel repository
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esecuzione script Python
        run: |
          python htsportterm.py

      - name: Committa e spingi le modifiche su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico palinsesto Htsport" && git push)
